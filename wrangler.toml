name = "ritiriwajshop"
main = "src/worker.js"
compatibility_date = "2026-09-09"
workers_dev = true
preview_urls = true
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# Cloudflare Wrangler automatically provisions this D1 database on first deploy.
[[d1_databases]]
binding = "DB"
database_name = "ritiriwaj-db"

[observability]
enabled = true
